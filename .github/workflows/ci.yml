name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls -d /Applications/Xcode*.app

      - name: Select Xcode (latest available)
        run: |
          # Find and use the latest Xcode version available
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Using $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          else
            echo "No Xcode found!"
            exit 1
          fi

      - name: Show Xcode and Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Configure Xcode for CI (skip macro validation)
        run: |
          # Skip macro fingerprint validation - required for Swift macros in CI
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      # `Package.resolved` is .gitignored, so we key on inputs that *do* land in
      # the checkout: the Xcode project (which records remote package URLs and
      # version pins) and any local `Package.swift` (GRDBCustom, NewsCombMCPBridge).
      # Branch-tracking remote packages advance silently relative to this key —
      # that's fine; the cache then goes stale and xcodebuild re-resolves.
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('NewsCombApp.xcodeproj/project.pbxproj', '**/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build NewsCombApp
        run: |
          xcodebuild build \
            -scheme NewsCombApp \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test NewsCombApp
        run: |
          xcodebuild test \
            -scheme NewsCombApp \
            -destination 'platform=macOS' \
            -skip-testing:NewsCombAppUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  lint:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --lenient NewsCombApp
